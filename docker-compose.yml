services:
  database:
    image: postgres:17-alpine
    container_name: sioverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sioverse
      POSTGRES_PASSWORD: sioverse
      POSTGRES_DB: sioverse
    ports:
      - "5432:5432"
    volumes:
      - sioverse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sioverse -d sioverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sioverse_postgres:

